<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fial Labs</title>
<meta name="description" content="Fial Labs — petit studio indépendant d'applications et de jeux mobiles.">
<style>
  :root { --bg: #fbfaf8; --fg: #1d1c1a; --muted: #6b6862; --line: #e4e1dc; --link: #1d1c1a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161514; --fg: #ece9e4; --muted: #9a968f; --line: #2c2a27; --link: #ece9e4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem 3rem; }
  h1 { font-size: 2rem; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 .5rem; }
  .lead { color: var(--muted); margin: 0 0 3rem; }
  h2 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
       color: var(--muted); margin: 0 0 .75rem; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { color: var(--link); text-decoration: none; display: block; padding: .75rem 0; }
  a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .9rem; }
  footer a { display: inline; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Fial Labs</h1>
  <p class="lead">Petit studio indépendant d'applications et de jeux mobiles, en France.</p>

  <h2>Politiques de confidentialité</h2>
  <ul>
    <li><a href="/poffipop-privacy/">Poffi Pop</a></li>
  </ul>

  <footer>Contact : <a href="mailto:fiallabs@gmail.com">fiallabs@gmail.com</a></footer>
</main>
</body>
</html>
